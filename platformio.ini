[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_eol = LF
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
